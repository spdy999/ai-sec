# Temporary companion to oidc-claims.yml: the same claims, but requested from a
# job inside a called reusable workflow, which is how the deploy pipeline is
# shaped.

name: oidc claims (reusable)

on:
  workflow_call:

jobs:
  claims:
    runs-on: ubuntu-latest

    # Declared here, in the called workflow, exactly as tf-reusable-workflow.yaml
    # declares it.
    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            core.info('called reusable workflow, environment declared inside it');
            core.info(`sub              = ${claims.sub}`);
            core.info(`aud              = ${claims.aud}`);
            core.info(`job_workflow_ref = ${claims.job_workflow_ref}`);
