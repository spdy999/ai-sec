# The platform layer on its own: VPC, cluster, nodes, endpoints.
#
# Use this to re-run one layer. A first deployment of an empty account should
# go through infra-provision.yml instead, which orders the two layers.

name: infra eks-platform

# Trunk based: a push to main that touches this layer plans it automatically,
# against real state and real credentials, and stops there. Nothing reaches the
# account without someone dispatching apply. The plan is the change detection --
# it is how a config edit that would destroy a node group is seen before it
# does.
on:
  push:
    branches: [main]
    paths:
      - controls/terraform/eks-platform/**
      - controls/terraform/modules/**
      - controls/policy/**
      - .github/scripts/tf-config.sh
      - .github/workflows/tf-reusable-workflow.yaml
      - .github/workflows/infra-eks-platform.yml
  workflow_dispatch:
    inputs:
      action:
        description: plan, apply or destroy
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: apply

# An apply or a destroy contends for the live account, so both share one lock
# and queue. A plan changes nothing, so it runs in its own lane and a newer push
# supersedes an older plan rather than waiting for it.
concurrency:
  group: ${{ (inputs.action == 'apply' || inputs.action == 'destroy') && 'genai-platform-live' || format('genai-plan-{0}', github.workflow) }}
  cancel-in-progress: ${{ inputs.action != 'apply' && inputs.action != 'destroy' }}

permissions:
  contents: read

jobs:
  layer:
    uses: ./.github/workflows/tf-reusable-workflow.yaml
    with:
      layer: eks-platform
      action: ${{ inputs.action || 'plan' }}
      # security.yml runs the offline gate chain on this same commit already. A
      # dispatch can arrive on a commit that never saw it, so that path keeps it.
      run_gate: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit
