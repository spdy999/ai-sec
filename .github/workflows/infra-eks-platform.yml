# The platform layer on its own: VPC, cluster, nodes, endpoints.
#
# Use this to re-run one layer. A first deployment of an empty account should
# go through infra-provision.yml instead, which orders the two layers.

name: infra eks-platform

# Trunk based: a push to main that touches this layer applies it. The offline
# gate chain has already run on the same commit in security.yml, and the policy
# gate runs again here against the saved plan -- the bytes about to be applied,
# not an offline approximation of them.
#
# What this gives up is the pause between seeing a plan and accepting it, so a
# commit that would destroy a node group destroys it. What it buys is that the
# account matches main, rather than matching whichever apply someone last
# remembered to dispatch. `plan` remains available by hand.
on:
  push:
    branches: [main]
    paths:
      - controls/terraform/eks-platform/**
      - controls/terraform/modules/**
      - controls/policy/**
      - .github/scripts/tf-config.sh
      - .github/workflows/tf-reusable-workflow.yaml
      - .github/workflows/infra-eks-platform.yml
  workflow_dispatch:
    inputs:
      action:
        description: plan, apply or destroy
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: apply

# A push applies, so everything but an explicit plan contends for the live
# account: one lock, and runs queue rather than race. Two applies at once is how
# a layer ends up half one commit and half another.
concurrency:
  group: ${{ inputs.action == 'plan' && format('genai-plan-{0}', github.workflow) || 'genai-platform-live' }}
  cancel-in-progress: ${{ inputs.action == 'plan' }}

permissions:
  contents: read

jobs:
  layer:
    uses: ./.github/workflows/tf-reusable-workflow.yaml
    with:
      layer: eks-platform
      action: ${{ inputs.action || 'apply' }}
      # Always, now that a push applies. security.yml runs the same chain on the
      # same commit, but it runs in parallel with this one and so gates nothing:
      # a failing gate there would not stop an apply here. Duplicated work, and
      # the duplicate is the one with the power to refuse.
    permissions:
      contents: read
      id-token: write
    secrets: inherit
