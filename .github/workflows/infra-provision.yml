# Both layers, in dependency order.
#
# bedrock-ai's inputs are eks-platform's outputs, so the order is not a
# preference. This workflow exists so nobody has to remember it.
#
# Cost: roughly $17/day while up, two thirds of it OpenSearch Serverless. Run
# infra-destroy.yml when the session ends.

name: infra provision

# Change detection lands here rather than on the two callers, and that is the
# whole point: a push that touches both layers would otherwise start both
# workflows at once. The shared concurrency lock makes them queue, but queueing
# is not ordering -- GitHub picks the winner, and picking the AI layer first is
# how its egress rule silently counted to zero against a platform layer that had
# not yet published the security group id it reads.
#
# One entry point, `needs` between the jobs, order guaranteed. The callers stay
# for re-running a single layer by hand.
on:
  push:
    branches: [main]
    paths:
      - controls/terraform/**
      - controls/policy/**
      - .github/scripts/tf-config.sh
      - .github/scripts/tf-wire.sh
      - .github/workflows/tf-reusable-workflow.yaml
      - .github/workflows/infra-provision.yml
  workflow_dispatch:

concurrency:
  group: genai-platform-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eks-platform:
    uses: ./.github/workflows/tf-reusable-workflow.yaml
    with:
      layer: eks-platform
      action: apply
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  bedrock-ai:
    needs: [eks-platform]
    uses: ./.github/workflows/tf-reusable-workflow.yaml
    with:
      layer: bedrock-ai
      action: apply
      # The platform layer just ran the gate chain on this same commit.
      run_gate: false
    permissions:
      contents: read
      id-token: write
    secrets: inherit
