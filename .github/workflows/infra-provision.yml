# Both layers, in dependency order.
#
# bedrock-ai's inputs are eks-platform's outputs, so the order is not a
# preference. This workflow exists so nobody has to remember it.
#
# Cost: roughly $16/day while up, about 71% of it OpenSearch Serverless. Run
# infra-destroy.yml when the session ends.

name: infra provision

on:
  workflow_dispatch:

concurrency:
  group: genai-platform-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eks-platform:
    uses: ./.github/workflows/tf-layer.yml
    with:
      layer: eks-platform
      action: apply
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  bedrock-ai:
    needs: [eks-platform]
    uses: ./.github/workflows/tf-layer.yml
    with:
      layer: bedrock-ai
      action: apply
      # The platform layer just ran the gate chain on this same commit.
      run_gate: false
    permissions:
      contents: read
      id-token: write
    secrets: inherit
