# Generate the application's secret material, once, inside the VPC.
#
# Two values the service needs and nobody may read from a manifest: the key
# that signs caller identity tokens, and the TLS key pair the pod presents on
# :8443. Terraform creates the secret containers and deliberately never a
# version resource, because a version puts the plaintext into state.
#
# The generation happens on the jump host rather than on this runner, so the
# material is created inside the VPC, written to Secrets Manager over an
# endpoint, and never exists on a machine outside the account. What this
# workflow handles is the ordering and the audit trail, not the secret.
#
# Dispatch-only, and rerunning it rotates both values. The pods pick a rotated
# value up on restart, not before -- the deploy workflow's rollout is what
# completes a rotation.

name: app secrets

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "rotate" to overwrite the existing values.
        required: true
        type: string

concurrency:
  group: genai-app-secrets
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_VERSION: "1.14.8"
  TF_EKS: controls/terraform/eks-platform
  TF_AI: controls/terraform/bedrock-ai

jobs:
  secrets:
    name: generate and store
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: refuse without the typed confirmation
        if: inputs.confirm != 'rotate'
        run: |
          echo "confirm must be the word rotate; refusing to overwrite live secret material" >&2
          exit 1

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-secrets-${{ github.run_id }}

      - name: read targets from applied state
        id: state
        run: |
          set -euo pipefail
          ./.github/scripts/tf-config.sh "$TF_EKS" eks-platform
          ./.github/scripts/tf-config.sh "$TF_AI" bedrock-ai
          terraform -chdir="$TF_EKS" init -input=false -no-color >/dev/null
          terraform -chdir="$TF_AI"  init -input=false -no-color >/dev/null

          {
            echo "instance=$(terraform -chdir="$TF_EKS" output -raw bastion_instance_id)"
            echo "identity_arn=$(terraform -chdir="$TF_AI" output -raw identity_signing_key_secret_arn)"
            echo "tls_arn=$(terraform -chdir="$TF_AI" output -raw tls_secret_arn)"
          } >> "$GITHUB_OUTPUT"
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}

      - name: generate on the jump host and store
        run: |
          set -euo pipefail
          cat > /tmp/secrets.sh <<EOF
          set -eu
          umask 077
          workdir="\$(mktemp -d)"
          trap 'rm -rf "\$workdir"' EXIT
          cd "\$workdir"

          # The signing key. 48 random bytes, base64, never echoed.
          aws secretsmanager put-secret-value \
            --region ${{ env.AWS_REGION }} \
            --secret-id '${{ steps.state.outputs.identity_arn }}' \
            --secret-string "\$(openssl rand -base64 48)" >/dev/null

          # The listener's key pair. Self-signed is correct here: the only
          # client is an operator port-forward, and the alternative is an
          # unencrypted bearer token crossing the cluster network.
          openssl req -x509 -newkey rsa:2048 -nodes -days 90 \
            -subj '/CN=genai-mediation.genai-platform.svc' \
            -keyout tls.key -out tls.crt 2>/dev/null

          python3 - <<'PY' > bundle.json
          import json, pathlib
          print(json.dumps({
              "certificate": pathlib.Path("tls.crt").read_text(),
              "private_key": pathlib.Path("tls.key").read_text(),
          }))
          PY

          aws secretsmanager put-secret-value \
            --region ${{ env.AWS_REGION }} \
            --secret-id '${{ steps.state.outputs.tls_arn }}' \
            --secret-string file://bundle.json >/dev/null

          echo "both secrets written"
          EOF

          ./.github/scripts/ssm-run.sh "${{ steps.state.outputs.instance }}" /tmp/secrets.sh

      - name: report
        run: |
          {
            echo "### Application secrets written"
            echo
            echo "Generated on the jump host, inside the VPC. Neither value passed"
            echo "through this runner, and neither is in Terraform state."
            echo
            echo "Restart the pods to pick them up: dispatch \`app deploy\`."
          } >> "$GITHUB_STEP_SUMMARY"
