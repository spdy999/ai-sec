# NOT DEPLOYED. The Kyverno controller is not installed on the cluster and
# render.sh copies base/ only, so nothing here is applied. The properties
# below are enforced in the pipeline gate; this file is the second half of
# that pair, written and waiting for the controller.
#
# Kyverno: workload identity hygiene.
#
# IRSA is only as good as the service account it is bound to. These rules stop
# the two ways it is commonly undermined: running as default, and mounting an
# API token that was never needed.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-workload-identity
  annotations:
    policies.kyverno.io/title: Workload identity hygiene
    policies.kyverno.io/category: Identity
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    # The default service account has no IRSA annotation and is shared by
    # anything that forgets to name one. A pod running as default is a pod
    # whose identity nobody chose.
    - name: no-default-service-account
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [genai-platform]
      validate:
        message: >-
          Pods must name a dedicated service account. The default account is
          shared and carries no workload identity.
        pattern:
          spec:
            serviceAccountName: "!default"

    # An automounted API token is a credential the workload did not ask for and
    # usually does not need. Stolen, it talks to the API server.
    - name: no-automounted-api-token
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [genai-platform]
      validate:
        message: >-
          automountServiceAccountToken must be false. Project a token with an
          explicit audience instead, so a stolen token cannot reach the API server.
        pattern:
          spec:
            automountServiceAccountToken: "false"
