# REJECTED BY: policy gate (conftest)
#
# A ClusterRole granting every verb on every resource, bound to the workload
# service account. This is the single change that turns a contained prompt
# injection into full cluster compromise: the attacker inherits the ability to
# read every Secret in every namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: genai-mediation-admin
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: genai-mediation-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: genai-mediation-admin
subjects:
  - kind: ServiceAccount
    name: genai-mediation
    namespace: genai-platform
