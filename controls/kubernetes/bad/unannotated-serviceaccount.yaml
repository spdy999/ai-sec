# Breaks: workload identity.
#
# No eks.amazonaws.com/role-arn annotation, so there is no IRSA binding. A pod
# using this account reaches AWS as whatever the node instance profile is, which
# means every pod on that node shares one identity and the audit trail cannot
# attribute a Bedrock call to a workload.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: genai-unbound
  namespace: genai-platform
  labels:
    app.kubernetes.io/part-of: genai-assistant
