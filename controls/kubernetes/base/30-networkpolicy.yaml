# Default deny, in both directions, for every pod in the namespace.
#
# This is the control that turns a successful prompt injection into a failed
# one. An attacker who convinces the assistant to POST the HR corpus to their
# server gets a connection timeout: the pod has no egress route except the ones
# named below, and "the attacker's host" is not among them.
#
# An empty podSelector means every pod. Applied first, so a pod that is later
# added to the namespace is denied by default rather than open by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: genai-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# DNS is the one egress every workload needs. Restricted to the cluster DNS
# service on 53 only, so it cannot be used as a tunnel to an arbitrary resolver.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: genai-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: genai-mediation
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# AWS APIs, reached only through the VPC interface endpoints in the private
# subnets. The CIDR is the subnet range, not 0.0.0.0/0: the pod can reach
# Bedrock and S3 through the endpoint ENIs and nothing else on the internet,
# because nothing else is routable from this VPC in the first place.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vpc-endpoints
  namespace: genai-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: genai-mediation
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.80.0.0/16
      ports:
        - protocol: TCP
          port: 443
---
# Ingress from the in-cluster gateway only. Nothing reaches the mediation layer
# without passing the authenticating proxy first.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: genai-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: genai-mediation
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-gateway
      ports:
        - protocol: TCP
          port: 8443
---
# Operator access, for `kubectl port-forward` from the jump host.
#
# Port-forwarded traffic is opened by the kubelet, so it arrives from the node's
# own address rather than from a pod, and the gateway rule above does not match
# it. Without this policy the forward connects and then hangs, which reads like
# a broken service rather than a working network policy.
#
# Scoped to the private subnet range and to 8443. It is a deliberate second door
# and it is worth being honest about: in production the gateway above is the
# only way in, and this policy is the one to delete first. It stays because the
# authenticating gateway is described in the design and not deployed, and
# because an operator path that exists but is undocumented is worse than one
# that is written down.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-operator-portforward
  namespace: genai-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: genai-mediation
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.80.0.0/16
      ports:
        - protocol: TCP
          port: 8443
