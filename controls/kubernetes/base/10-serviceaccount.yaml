# The workload identity, bridged to AWS.
#
# The annotation is what makes IRSA work: the pod presents a projected token to
# STS and receives short-lived AWS credentials. No access key exists on the
# node, in a Secret, or in an environment variable.
#
# automountServiceAccountToken is false on purpose. The default mounts a token
# that can talk to the Kubernetes API, which this workload never needs. The
# token it does need is projected explicitly in the deployment, with an audience
# of sts.amazonaws.com, so it is useless against the API server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: genai-mediation
  namespace: genai-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/genai-assistant-prod-mediation
    eks.amazonaws.com/sts-regional-endpoints: "true"
  labels:
    app.kubernetes.io/name: genai-mediation
    app.kubernetes.io/part-of: koerber-genai-assistant
automountServiceAccountToken: false
